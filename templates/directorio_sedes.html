{% extends "base.html" %}

{% block title %}Directorio de Sedes - FutbolSim{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <div>
        <h1 class="display-6 fw-bold mb-1">Directorio de Sedes</h1>
        <p class="text-muted mb-0">Patrociná ciudades sede y cobrá regalías cada vez que se juegue un partido ahí.</p>
    </div>
    <div class="d-flex align-items-center gap-3">
        <a href="{{ url_for('venues_portafolio_vista') }}" class="btn btn-outline-success btn-sm">
            <i class="bi bi-building me-1"></i>Mi Portafolio
        </a>
    </div>
</div>

<div class="d-flex flex-wrap gap-2 mb-3">
    <input type="text" id="buscarCiudad" class="form-control" style="max-width: 280px;" placeholder="Buscar por ciudad o país...">
    <select id="filtroEstado" class="form-select" style="max-width: 220px;">
        <option value="">Todos los estados</option>
        <option value="disponible">Disponibles</option>
        <option value="mias">Mis sedes</option>
        <option value="ocupada">De otros usuarios</option>
    </select>
</div>

<div id="alertaDirectorio" class="alert d-none" role="alert"></div>

<p id="contadorCiudades" class="text-muted small mb-2" aria-live="polite"></p>
<div class="row g-3" id="listaCiudades"></div>
<p id="sinResultados" class="text-muted text-center py-4 d-none">No se encontraron ciudades con esos criterios.</p>
<div class="text-center mt-3">
    <button type="button" id="btnCargarMas" class="btn btn-outline-light d-none"><i class="bi bi-arrow-down-circle me-1"></i>Cargar más ciudades</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const urlBuscar = "{{ url_for('venues_buscar') }}";
    const urlComprarTemplate = "{{ url_for('venues_buy', ciudad_id='__CIUDAD_ID__') }}";
    const urlPortafolio = "{{ url_for('venues_portafolio_vista') }}";
    const POR_PAGINA = 50;

    const listaCiudades = document.getElementById('listaCiudades');
    const sinResultados = document.getElementById('sinResultados');
    const alertaDirectorio = document.getElementById('alertaDirectorio');
    const buscarCiudad = document.getElementById('buscarCiudad');
    const filtroEstado = document.getElementById('filtroEstado');
    const contador = document.getElementById('contadorCiudades');
    const btnCargarMas = document.getElementById('btnCargarMas');

    // Búsqueda, filtro de estado y paginación se resuelven en el servidor (hay >4000 ciudades)
    let ciudades = {{ ciudades | tojson }};
    let total = {{ total_ciudades }};
    let temporizadorBusqueda = null;
    let consultaActual = 0;

    const mostrarAlerta = (mensaje, tipo) => UI.mostrarAlertaEn(alertaDirectorio, mensaje, tipo);

    function tarjetaCiudad(c) {
        const e = UI.escapar;
        let estadoBadge = '<span class="badge bg-success">Disponible</span>';
        let botonHtml = `<button type="button" class="btn btn-success btn-sm w-100 fw-bold btn-comprar" data-ciudad-id="${c.ciudad_id}"
                            data-nombre="${e(c.nombre)}" data-costo="${c.costo}"><i class="bi bi-bag-plus-fill me-1"></i>Patrocinar (${c.costo} pts)</button>`;
        if (c.es_mia) {
            estadoBadge = '<span class="badge bg-info text-dark">Tuya</span>';
            botonHtml = `<a href="${urlPortafolio}" class="btn btn-outline-info btn-sm w-100 fw-bold"><i class="bi bi-building me-1"></i>Ver en mi portafolio</a>`;
        } else if (c.tiene_dueno) {
            estadoBadge = '<span class="badge bg-secondary">Ocupada</span>';
            botonHtml = `<button type="button" class="btn btn-outline-secondary btn-sm w-100" disabled>No disponible</button>`;
        }
        return `
            <div class="col-12 col-md-6 col-xl-4">
                <div class="card bg-dark border-0 shadow-sm h-100">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <div class="fw-bold text-white">${e(c.nombre)}</div>
                                <small class="text-muted"><i class="bi bi-flag-fill me-1"></i>${e(c.pais_nombre || '-')}</small>
                            </div>
                            ${estadoBadge}
                        </div>
                        <div class="text-muted small mb-3"><i class="bi bi-building-fill me-1"></i>${e(c.estadio || 'Estadio sin nombre')}</div>
                        ${botonHtml}
                    </div>
                </div>
            </div>`;
    }

    function renderizar() {
        listaCiudades.innerHTML = ciudades.map(tarjetaCiudad).join('');
        sinResultados.classList.toggle('d-none', ciudades.length > 0);
        contador.textContent = ciudades.length ? `Mostrando ${ciudades.length.toLocaleString('en-US')} de ${total.toLocaleString('en-US')} ciudades` : '';
        btnCargarMas.classList.toggle('d-none', ciudades.length >= total);
    }

    async function buscar(agregar) {
        const consulta = ++consultaActual;
        const params = new URLSearchParams({ q: buscarCiudad.value.trim(), estado: filtroEstado.value, limite: POR_PAGINA, saltar: agregar ? ciudades.length : 0 });
        btnCargarMas.disabled = true;
        if (!agregar) contador.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Buscando…';
        try {
            const resp = await fetch(`${urlBuscar}?${params}`);
            if (!resp.ok) throw new Error();
            const data = await resp.json();
            if (consulta !== consultaActual) return; // llegó tarde: hay una búsqueda más nueva
            total = Number(resp.headers.get('X-Total-Count') || data.length);
            ciudades = agregar ? ciudades.concat(data) : data;
            renderizar();
        } catch (e) {
            mostrarAlerta('No se pudo actualizar la búsqueda.', 'danger');
        } finally {
            btnCargarMas.disabled = false;
        }
    }

    // Delegación: un solo listener para los botones de compra (las tarjetas se re-renderizan)
    listaCiudades.addEventListener('click', async ev => {
        const btn = ev.target.closest('.btn-comprar');
        if (!btn) return;
        const ok = await UI.confirmar({
            titulo: `Patrocinar ${btn.dataset.nombre}`,
            mensaje: `Se descontarán ${btn.dataset.costo} pts de tu saldo. Cobrás regalías cada vez que se juegue un partido en esta sede.`,
            textoConfirmar: `Patrocinar por ${btn.dataset.costo} pts`,
        });
        if (!ok) return;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
        try {
            const resp = await fetch(urlComprarTemplate.replace('__CIUDAD_ID__', btn.dataset.ciudadId), { method: 'POST' });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.detail || 'No se pudo completar la compra.');
            UI.refrescarSaldo();
            mostrarAlerta('¡Sede patrocinada! Redirigiendo a tu portafolio...', 'success');
            setTimeout(() => { window.location.href = urlPortafolio; }, 1200);
        } catch (err) {
            mostrarAlerta(err.message, 'danger');
            btn.disabled = false;
            btn.innerHTML = `<i class="bi bi-bag-plus-fill me-1"></i>Patrocinar (${btn.dataset.costo} pts)`;
        }
    });

    buscarCiudad.addEventListener('input', () => { clearTimeout(temporizadorBusqueda); temporizadorBusqueda = setTimeout(() => buscar(false), 350); });
    filtroEstado.addEventListener('change', () => buscar(false));
    btnCargarMas.addEventListener('click', () => buscar(true));

    renderizar();
});
</script>
{% endblock %}
