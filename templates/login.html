{% extends "base.html" %}

{% block title %}Iniciar Sesión - FutbolSim{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <div class="card bg-dark text-white shadow-lg border-0 rounded-4 overflow-hidden mt-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="display-4 mb-2">⚽</div>
                    <h1 class="h3 fw-bold mb-1">Iniciar Sesión</h1>
                    <p class="text-muted small mb-0">Entrá a tu cuenta de FutbolSim</p>
                </div>

                {% if error %}
                    <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span>{{ error }}</span>
                    </div>
                {% endif %}

                <form method="post" action="{{ url_for('login_submit') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label small text-uppercase text-muted">Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" value="{{ username if username else '' }}" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label small text-uppercase text-muted">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
                    </button>
                </form>

                <p class="text-center text-muted small mt-4 mb-0">
                    ¿No tenés cuenta? Pedísela a un administrador.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
