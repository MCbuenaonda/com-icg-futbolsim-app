{% extends "base.html" %}

{% block title %}Crear Cuenta - FutbolSim{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <div class="card bg-dark text-white shadow-lg border-0 rounded-4 overflow-hidden mt-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="display-4 mb-2">⚽</div>
                    <h1 class="h3 fw-bold mb-1">Crear Cuenta</h1>
                    <p class="text-muted small mb-0">Sumate al Simulador de Fútbol</p>
                </div>

                {% if error %}
                    <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span>{{ error }}</span>
                    </div>
                {% endif %}

                <form method="post" action="{{ url_for('registro_submit') }}">
                    <div class="mb-3">
                        <label for="nombre" class="form-label small text-uppercase text-muted">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ nombre if nombre else '' }}" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label small text-uppercase text-muted">Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" value="{{ username if username else '' }}" minlength="3" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label small text-uppercase text-muted">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" minlength="6" required>
                        <small class="text-muted">Mínimo 6 caracteres</small>
                    </div>
                    <div class="mb-4">
                        <label for="password_confirmacion" class="form-label small text-uppercase text-muted">Confirmar contraseña</label>
                        <input type="password" class="form-control" id="password_confirmacion" name="password_confirmacion" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2">
                        <i class="bi bi-person-plus-fill me-1"></i>Crear cuenta
                    </button>
                </form>

                <p class="text-center text-muted small mt-4 mb-0">
                    ¿Ya tenés cuenta? <a href="{{ url_for('login') }}" class="link-success fw-bold">Iniciá sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
