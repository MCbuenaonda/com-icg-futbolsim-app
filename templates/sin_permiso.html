{% extends "base.html" %}

{% block title %}Sin permiso - FutbolSim{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card bg-dark text-white border-0 shadow-lg rounded-4 mt-5 text-center">
            <div class="card-body p-5">
                <div class="display-4 mb-3">🔒</div>
                <h1 class="h3 fw-bold">No tienes acceso a esta sección</h1>
                <p class="text-muted mb-4">{{ mensaje or 'Tu rol no incluye esta sección.' }} Si crees que deberías verla, pídele a un administrador que revise tu rol.</p>
                <a href="{{ url_inicio or '/cuenta' }}" class="btn btn-success fw-bold"><i class="bi bi-house-door me-1"></i>Ir a mi inicio</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
